<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开学倒计时</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg1: #0b1026;
    --bg2: #141b3d;
    --accent: #7c9cff;
    --text: #eef1ff;
    --muted: #9aa3c7;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(60% 50% at 20% 10%, rgba(124, 156, 255, 0.18), transparent 60%),
      radial-gradient(50% 40% at 85% 90%, rgba(167, 139, 250, 0.15), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }

  .card {
    width: 100%;
    max-width: 720px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    padding: 56px 32px 48px;
    text-align: center;
  }

  .label {
    font-size: 15px;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  .countdown {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(8px, 3vw, 24px);
    flex-wrap: nowrap;
  }

  .unit {
    min-width: clamp(64px, 18vw, 120px);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .number {
    font-size: clamp(44px, 12vw, 84px);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .number.seconds {
    color: var(--accent);
    transition: transform 0.15s ease;
  }

  .number.seconds.tick {
    transform: translateY(-3px);
  }

  .sep {
    font-size: clamp(36px, 10vw, 72px);
    font-weight: 300;
    color: var(--muted);
    opacity: 0.5;
    line-height: 1;
    margin-top: 0;
    user-select: none;
  }

  .unit-name {
    margin-top: 16px;
    font-size: clamp(12px, 3.5vw, 15px);
    color: var(--muted);
    letter-spacing: 0.2em;
    text-indent: 0.2em;
  }

  .target {
    margin-top: 48px;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .finished {
    display: none;
    margin-top: 8px;
    font-size: clamp(28px, 7vw, 44px);
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  @media (max-width: 480px) {
    .card { padding: 40px 16px 36px; border-radius: 22px; }
    .label { letter-spacing: 0.3em; text-indent: 0.3em; }
  }
</style>
</head>
<body>
  <main class="card">
    <p class="label">距离开学还有</p>
    <div class="countdown" id="countdown">
      <div class="unit">
        <span class="number" id="d">0</span>
        <span class="unit-name">天</span>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <span class="number" id="h">00</span>
        <span class="unit-name">小时</span>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <span class="number" id="m">00</span>
        <span class="unit-name">分钟</span>
      </div>
      <span class="sep">:</span>
      <div class="unit">
        <span class="number seconds" id="s">00</span>
        <span class="unit-name">秒</span>
      </div>
    </div>
    <p class="finished" id="finished">开学啦！新学期加油</p>
    <p class="target" id="target"></p>
  </main>

  <script>
    // 开学时间：北京时间 2026 年 9 月 1 日 07:20:00（UTC+8），
    // 写成绝对时间戳便于任何时区的访客都能得到正确结果。
    var TARGET = new Date('2026-09-01T07:20:00+08:00').getTime();

    var el = {
      d: document.getElementById('d'),
      h: document.getElementById('h'),
      m: document.getElementById('m'),
      s: document.getElementById('s'),
      countdown: document.getElementById('countdown'),
      finished: document.getElementById('finished'),
      target: document.getElementById('target')
    };

    el.target.textContent = '开学时间：' + new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai',
      year: 'numeric', month: 'long', day: 'numeric',
      weekday: 'long', hour: '2-digit', minute: '2-digit',
      hour12: false
    }).format(TARGET) + '（北京时间）';

    function pad(n, len) {
      return String(n).padStart(len, '0');
    }

    function tick() {
      var remain = Math.max(0, TARGET - Date.now());
      var totalSec = Math.floor(remain / 1000);

      var days = Math.floor(totalSec / 86400);
      var hours = Math.floor((totalSec % 86400) / 3600);
      var minutes = Math.floor((totalSec % 3600) / 60);
      var seconds = totalSec % 60;

      el.d.textContent = days;
      el.h.textContent = pad(hours, 2);
      el.m.textContent = pad(minutes, 2);

      if (el.s.textContent !== pad(seconds, 2)) {
        el.s.textContent = pad(seconds, 2);
        el.s.classList.remove('tick');
        void el.s.offsetWidth; // 重新触发动画
        el.s.classList.add('tick');
      }

      if (remain <= 0) {
        el.countdown.style.display = 'none';
        el.finished.style.display = 'block';
      }
    }

    tick();
    // 每 250ms 刷新一次，避免与秒边界漂移导致跳秒
    setInterval(tick, 250);
  </script>
</body>
</html>
